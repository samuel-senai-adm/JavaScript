<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte sua Pizza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🍕 Monte Uma Pizza!!</h1>

    <h4>Ingredientes:</h4>

    <div id="ingredientes">

        <div class="ingrediente" draggable="true">Queijo</div>
        <div class="ingrediente" draggable="true">Molho</div>
        <div class="ingrediente" draggable="true">Tomate</div>
        <div class="ingrediente" draggable="true">Champignon</div>
        <div class="ingrediente" draggable="true">Frango</div>
        <div class="ingrediente" draggable="true">Catupiry</div>
        <div class="ingrediente" draggable="true">Calabresa</div>
        <div class="ingrediente" draggable="true">Costela</div>
        <div class="ingrediente" draggable="true">Doritos</div>
        <div class="ingrediente" draggable="true">Nutella</div>
        <div class="ingrediente" draggable="true">Morango</div>

    </div>

    <hr>

    <div id="pizza">
        <h4>🍕 Monte Sua Pizza</h4>
        <p>Arraste os ingredientes aqui!</p>
    </div>

    <button id="concluir">Concluir Pizza!</button>

    <p id="mensagem"></p>

    <script src="script.js"></script>

</body>
</html>
