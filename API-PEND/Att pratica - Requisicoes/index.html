<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>API Naruto</title>
</head>

<body>

    <h1>API Naruto</h1>


    <!-- PERSONAGENS -->

    <h2>Personagens</h2>

    <input type="number" id="idPersonagem" placeholder="Digite o ID">

    <button id="buscarPersonagem">
        Buscar personagem
    </button>

    <br><br>

    <input type="text" id="nomePersonagem" placeholder="Digite o nome">

    <button id="buscarPersonagemNome">
        Buscar por nome
    </button>

    <div id="resultadoPersonagem"></div>


    <hr>


    <!-- CLÃS -->

    <h2>Clãs</h2>

    <input type="number" id="idCla" placeholder="Digite o ID">

    <button id="buscarCla">
        Buscar clã
    </button>

    <br><br>

    <input type="text" id="nomeCla" placeholder="Digite o nome">

    <button id="buscarClaNome">
        Buscar por nome
    </button>

    <div id="resultadoCla"></div>


    <hr>


    <!-- VILAS -->

    <h2>Vilas</h2>

    <input type="number" id="idVila" placeholder="Digite o ID">

    <button id="buscarVila">
        Buscar vila
    </button>

    <br><br>

    <input type="text" id="nomeVila" placeholder="Digite o nome">

    <button id="buscarVilaNome">
        Buscar por nome
    </button>

    <div id="resultadoVila"></div>


    <hr>


    <!-- KEKKEI-GENKAI -->

    <h2>Kekkei-genkai</h2>

    <input type="number" id="idKekkei" placeholder="Digite o ID">

    <button id="buscarKekkei">
        Buscar Kekkei-genkai
    </button>

    <br><br>

    <input type="text" id="nomeKekkei" placeholder="Digite o nome">

    <button id="buscarKekkeiNome">
        Buscar por nome
    </button>

    <div id="resultadoKekkei"></div>


    <script src="script.js"></script>

</body>

</html>
